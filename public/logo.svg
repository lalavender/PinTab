<svg width="960" height="256" viewBox="0 0 960 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="iconBg" x1="44" y1="24" x2="212" y2="232" gradientUnits="userSpaceOnUse">
      <stop stop-color="#ECFFF4"/>
      <stop offset="0.5" stop-color="#C4F7D8"/>
      <stop offset="1" stop-color="#8BE8B5"/>
    </linearGradient>

    <linearGradient id="page" x1="70" y1="54" x2="190" y2="204" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0FDF4"/>
    </linearGradient>

    <linearGradient id="fold" x1="144" y1="56" x2="198" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#DCFCE7"/>
      <stop offset="1" stop-color="#86EFAC"/>
    </linearGradient>

    <linearGradient id="bookmark" x1="106" y1="68" x2="154" y2="188" gradientUnits="userSpaceOnUse">
      <stop stop-color="#34D399"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>

    <linearGradient id="word" x1="284" y1="82" x2="564" y2="180" gradientUnits="userSpaceOnUse">
      <stop stop-color="#064E3B"/>
      <stop offset="1" stop-color="#047857"/>
    </linearGradient>

    <filter id="iconShadow" x="18" y="10" width="220" height="236" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#047857" flood-opacity="0.16"/>
    </filter>

    <filter id="pageShadow" x="50" y="42" width="158" height="168" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#047857" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Icon background -->
  <g filter="url(#iconShadow)">
    <rect x="32" y="24" width="208" height="208" rx="52" fill="url(#iconBg)"/>
  </g>

  <!-- Soft decoration -->
  <circle cx="75" cy="72" r="22" fill="#FFFFFF" opacity="0.45"/>
  <circle cx="198" cy="72" r="34" fill="#FFFFFF" opacity="0.28"/>
  <circle cx="198" cy="194" r="42" fill="#10B981" opacity="0.12"/>

  <!-- Page card -->
  <g filter="url(#pageShadow)">
    <path
      d="M70 76C70 63.85 79.85 54 92 54H156L202 100V180C202 192.15 192.15 202 180 202H92C79.85 202 70 192.15 70 180V76Z"
      fill="url(#page)"
    />
  </g>

  <!-- Fold corner -->
  <path
    d="M156 54V84C156 92.837 163.163 100 172 100H202L156 54Z"
    fill="url(#fold)"
  />

  <!-- Navigation blocks -->
  <rect x="88" y="86" width="54" height="16" rx="8" fill="#DCFCE7"/>
  <rect x="88" y="118" width="42" height="32" rx="10" fill="#BBF7D0"/>
  <rect x="140" y="118" width="44" height="32" rx="10" fill="#A7F3D0"/>
  <rect x="88" y="160" width="62" height="28" rx="10" fill="#D9F99D"/>
  <rect x="160" y="160" width="24" height="28" rx="10" fill="#CCFBF1"/>

  <!-- Bookmark -->
  <path
    d="M108 72C108 64.268 114.268 58 122 58H142C149.732 58 156 64.268 156 72V176C156 183.657 147.085 187.862 141.174 182.995L132 175.441L122.826 182.995C116.915 187.862 108 183.657 108 176V72Z"
    fill="url(#bookmark)"
  />

  <path
    d="M122 82C122 78.686 124.686 76 128 76H136C139.314 76 142 78.686 142 82V140C142 144.262 136.933 146.489 133.791 143.609L132 141.967L130.209 143.609C127.067 146.489 122 144.262 122 140V82Z"
    fill="white"
    opacity="0.92"
  />

  <!-- Wordmark -->
  <text
    x="284"
    y="126"
    fill="url(#word)"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
    font-size="72"
    font-weight="800"
    letter-spacing="-2.5"
  >
    PinTab
  </text>

  <!-- Tagline -->
  <text
    x="288"
    y="170"
    fill="#6B7280"
    font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif"
    font-size="24"
    font-weight="500"
    letter-spacing="-0.2"
  >
    Turn bookmarks into a clean new tab
  </text>
</svg>
